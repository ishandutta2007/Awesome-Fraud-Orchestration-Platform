<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.15); }
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }

    @keyframes scanLine {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(350px); opacity: 0; }
    }

    .bg-grid { stroke: #374151; stroke-width: 0.5; stroke-dasharray: 4 4; opacity: 0.3; }
    .flow-line { stroke: url(#primaryGlow); stroke-width: 2; stroke-dasharray: 8 6; animation: dashFlow 8s linear infinite; }
    .particle { animation: pulseParticle 4s ease-in-out infinite; }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .scanner { stroke: url(#primaryGlow); stroke-width: 2; animation: scanLine 6s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 42px; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #9CA3AF; font-size: 17px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #10B981; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="bg-grid">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" />
  </g>

  <!-- Glowing Flow Lines in Background -->
  <path d="M 800,60 Q 950,120 1120,80" fill="none" class="flow-line" opacity="0.6" />
  <path d="M 750,260 Q 900,200 1150,250" fill="none" class="flow-line" opacity="0.4" style="animation-duration: 12s;" />

  <!-- Ambient Glowing Orbs (Behind content) -->
  <circle cx="150" cy="80" r="140" fill="#6366F1" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="160" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />
  <circle cx="900" cy="240" r="100" fill="#10B981" opacity="0.1" filter="url(#glow)" />

  <!-- Decorative Animated Flow Elements (Right side background) -->
  <g class="card-1" transform="translate(850, 45)" filter="url(#cardShadow)">
    <rect width="280" height="64" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="30" cy="32" r="14" fill="#10B981" opacity="0.2" />
    <path d="M 24 32 L 28 36 L 36 28" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="29" font-family="sans-serif" font-weight="700" font-size="13" fill="#F3F4F6">Real-Time Risk Decision</text>
    <text x="56" y="47" font-family="sans-serif" font-weight="500" font-size="11" fill="#9CA3AF">Score: 12/100 • Action: APPROVE</text>
  </g>

  <g class="card-2" transform="translate(880, 135)" filter="url(#cardShadow)">
    <rect width="270" height="64" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="30" cy="32" r="14" fill="#6366F1" opacity="0.2" />
    <path d="M 22 32 H 38 M 30 24 V 40" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />
    <text x="56" y="29" font-family="sans-serif" font-weight="700" font-size="13" fill="#F3F4F6">Rules + ML Orchestration</text>
    <text x="56" y="47" font-family="sans-serif" font-weight="500" font-size="11" fill="#9CA3AF">Velocity + Device Signals</text>
  </g>

  <g class="card-1" transform="translate(810, 220)" filter="url(#cardShadow)" style="animation-delay: -2s;">
    <rect width="260" height="58" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <circle cx="28" cy="29" r="12" fill="#F59E0B" opacity="0.2" />
    <text x="24" y="34" font-family="sans-serif" font-weight="800" font-size="12" fill="#F59E0B">⚡</text>
    <text x="50" y="27" font-family="sans-serif" font-weight="700" font-size="12" fill="#F3F4F6">Case Operations & AML</text>
    <text x="50" y="43" font-family="sans-serif" font-weight="500" font-size="11" fill="#9CA3AF">Latency &lt; 15ms Pipeline</text>
  </g>

  <!-- Foreground Content Block (Left aligned, clean contrast) -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10B981" class="particle" />
    <text x="28" y="18" class="badge-text">Risk Ops &amp; Security 2026</text>

    <!-- Main Heading -->
    <text x="0" y="78" class="title-text">Awesome Fraud Orchestration</text>
    <text x="0" y="122" class="title-text" fill="url(#primaryGlow)">Platform Ecosystem 🛡️</text>

    <!-- Subtitle -->
    <text x="0" y="162" class="subtitle-text">A curated directory of top SaaS platforms, open-source risk engines,</text>
    <text x="0" y="186" class="subtitle-text">device intelligence signals, and real-time transaction monitoring frameworks.</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 212)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#374151" opacity="0.5" />
      <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">⚡ Real-Time Rules</text>

      <rect x="140" y="0" width="140" height="26" rx="6" fill="#374151" opacity="0.5" />
      <text x="152" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">🤖 ML Decisioning</text>

      <rect x="290" y="0" width="135" height="26" rx="6" fill="#374151" opacity="0.5" />
      <text x="302" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">🔍 Device Signals</text>

      <rect x="435" y="0" width="125" height="26" rx="6" fill="#374151" opacity="0.5" />
      <text x="447" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5E7EB">💼 Open Source</text>
    </g>
  </g>
</svg>
