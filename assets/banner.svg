<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Accent Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g stroke="#334155" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.4">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="840" y1="0" x2="840" y2="320" />
    <line x1="960" y1="0" x2="960" y2="320" />
    <line x1="1080" y1="0" x2="1080" y2="320" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="1000" cy="100" r="180" fill="url(#blueGlow)" />
  <circle cx="850" cy="240" r="140" fill="url(#purpleGlow)" />
  <circle cx="1100" cy="260" r="120" fill="url(#greenGlow)" />

  <!-- Flow Connector Lines -->
  <path d="M 760 100 Q 880 50 1000 90" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <path d="M 800 180 Q 920 220 1040 170" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
  <path d="M 720 250 Q 860 290 980 240" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Card 1: Real-Time Decisioning -->
  <g transform="translate(820, 45)">
    <rect width="320" height="65" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="32" r="16" fill="#10B981" fill-opacity="0.2" />
    <path d="M 28 32 L 34 38 L 44 26" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#F8FAFC">Real-Time Risk Decisioning</text>
    <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Score: 12/100 • Status: APPROVED</text>
  </g>

  <!-- Card 2: Rules + ML Pipeline -->
  <g transform="translate(850, 130)">
    <rect width="310" height="65" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="32" r="16" fill="#6366F1" fill-opacity="0.2" />
    <path d="M 26 32 H 46 M 36 22 V 42" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
    <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#F8FAFC">Rules + ML Orchestration</text>
    <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Velocity • Device • Identity Signals</text>
  </g>

  <!-- Card 3: RiskOps & Case Management -->
  <g transform="translate(780, 215)">
    <rect width="300" height="60" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="34" cy="30" r="14" fill="#F59E0B" fill-opacity="0.2" />
    <text x="28" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#F59E0B">⚡</text>
    <text x="58" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">Case Operations &amp; AML</text>
    <text x="58" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Sub-15ms Real-Time Pipeline</text>
  </g>

  <!-- Foreground Content Block (Left-Aligned, Crisp Text) -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="225" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="16" cy="14" r="5" fill="#34D399" />
    <text x="30" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#34D399" letter-spacing="1">RISK OPS &amp; SECURITY 2026</text>

    <!-- Main Title Lines -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="#F8FAFC" letter-spacing="-0.5">Awesome Fraud Orchestration</text>
    <text x="0" y="122" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="url(#titleGrad)" letter-spacing="-0.5">Platform Ecosystem 🛡️</text>

    <!-- Subtitle Lines -->
    <text x="0" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">Curated index of SaaS fraud platforms, open-source risk decision engines,</text>
    <text x="0" y="186" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#94A3B8">device intelligence signals, and real-time transaction monitoring workflows.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 212)">
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">⚡ Real-Time Rules</text>

      <rect x="147" y="0" width="145" height="28" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="161" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">🤖 ML Decisioning</text>

      <rect x="304" y="0" width="140" height="28" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="318" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">🔍 Device Signals</text>

      <rect x="456" y="0" width="130" height="28" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="470" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#E2E8F0">💻 Open Source</text>
    </g>
  </g>
</svg>
